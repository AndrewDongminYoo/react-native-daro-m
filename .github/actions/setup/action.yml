name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc

    - name: Verify vendored Yarn integrity
      shell: bash
      run: |
        node <<'NODE'
        const {createHash} = require('node:crypto');
        const {readFileSync} = require('node:fs');
        const manager = JSON.parse(readFileSync('package.json', 'utf8')).packageManager;
        const match = manager.match(/^yarn@(\d+\.\d+\.\d+)\+sha512\.([a-f0-9]{128})$/);
        if (!match) throw new Error('Expected an integrity-pinned Yarn package manager');
        const yarnPath = `.yarn/releases/yarn-${match[1]}.cjs`;
        const config = readFileSync('.yarnrc.yml', 'utf8');
        if (!config.split('\n').includes(`yarnPath: ${yarnPath}`)) throw new Error('Vendored Yarn path mismatch');
        const actual = createHash('sha512').update(readFileSync(yarnPath)).digest('hex');
        if (actual !== match[2]) throw new Error('Vendored Yarn SHA-512 mismatch');
        console.log('Vendored Yarn integrity verified');
        NODE

    - name: Enable Corepack
      run: corepack enable
      shell: bash

    - name: Restore dependencies
      id: yarn-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          **/node_modules
          .yarn/install-state.gz
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('**/package.json', '!node_modules/**') }}
        restore-keys: |
          ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          ${{ runner.os }}-yarn-

    - name: Install dependencies
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      run: yarn install --immutable
      shell: bash

    - name: Cache dependencies
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          **/node_modules
          .yarn/install-state.gz
        key: ${{ steps.yarn-cache.outputs.cache-primary-key }}

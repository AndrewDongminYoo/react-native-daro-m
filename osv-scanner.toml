[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
reason = "glob@13.0.6 via jest@30.5.2 (@jest/reporters, jest-config and jest-runtime) and react-native-builder-bob@0.43.2 (root) and 0.41.0 (example), and glob@10.5.0 via test-exclude@7.0.2 -> babel-plugin-istanbul@8.0.2 -> @jest/transform@30.5.2, have no compatible patch as of 2026-11-05: the advisory covers >= 9.0.0, <= 14.0.1 and the fix is glob 14.0.2. The newest releases of the parents (jest 30.5.2 and its @jest packages, react-native-builder-bob 0.44.1, test-exclude 8.0.0) still require glob@^13.0.6, and babel-plugin-istanbul 8.0.2 requires test-exclude@^7.0.1, which keeps glob 10. Medium severity, AbortSignal cancellation bypass that allows filesystem traversal after a timeout. No first-party source imports glob; every path in the lockfile ends at a devDependency (test runner and library build tooling), and the only runtime dependency is tinycolor2. Approved on 2026-11-05. Re-evaluate when jest, react-native-builder-bob, test-exclude or babel-plugin-istanbul accepts glob 14."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch@10.2.6 via glob@13.0.6, test-exclude@7.0.2, eslint@10.13.0, @eslint/config-array@0.23.5 and @typescript-eslint/typescript-estree@8.72.1, and minimatch@9.0.9 via glob@10.5.0, have no compatible patch as of 2026-11-05: the advisory covers >= 7.0.0, < 11.0.1 and the fix is minimatch 11.0.1. The newest releases of those parents (eslint 10.14.0, @eslint/config-array 0.23.5, @typescript-eslint/typescript-estree 8.72.1, test-exclude 8.0.0) still require minimatch ^10, and glob 13.0.6 and 10.5.0 require ^10.2.2 and ^9.0.4 (glob 14 requires ^11.0.2). Medium severity, DoS through amplification of glob parts. No first-party source imports minimatch; every path in the lockfile ends at a devDependency (lint, test runner and library build tooling), and the only runtime dependency is tinycolor2. Approved on 2026-11-05. Re-evaluate when eslint, @eslint/config-array, @typescript-eslint/typescript-estree, test-exclude or glob accepts minimatch 11."
